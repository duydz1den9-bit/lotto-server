<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản Lý Key VIP</title>
  <style>
    body{font-family:sans-serif;background:#121212;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
    .box{background:#1e1e1e;padding:20px;border-radius:10px;width:100%;max-width:420px;box-sizing:border-box;margin-bottom:15px}
    input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:6px;border:none;box-sizing:border-box}
    button{background:#00c853;color:#fff;font-weight:bold;cursor:pointer}
    .btn-list{background:#2979ff}
    .res{background:#2c2c2c;padding:12px;border-radius:6px;margin-top:10px;display:none;word-break:break-all}
    .key-item{background:#262626;padding:12px;border-radius:6px;margin-top:10px;border-left:4px solid #00e676;font-size:13px;line-height:1.6}
    .btn-del{background:#ff5252;padding:6px 10px;width:auto;margin-top:6px;font-size:12px}
  </style>
</head>
<body>
  <div class="box">
    <h3 style="text-align:center;color:#00e676;margin-top:0">QUẢN TRỊ KEY BẢN QUYỀN</h3>
    <input type="password" id="p" placeholder="Nhập mật khẩu Admin">
    <select id="d">
      <option value="1">Gói 1 Ngày</option>
      <option value="7">Gói 7 Ngày</option>
      <option value="30">Gói 30 Ngày</option>
      <option value="3650">Gói Vĩnh Viễn</option>
    </select>
    <button onclick="gen()">+ TẠO KEY MỚI</button>
    <button class="btn-list" onclick="loadList()">XEM DANH SÁCH KEY</button>
    <div class="res" id="r"></div>
  </div>
  <div class="box" id="listBox" style="display:none">
    <h4 style="margin-top:0;color:#38bdf8">DANH SÁCH KEY ĐANG LƯU</h4>
    <div id="listContent"></div>
  </div>
  <script>
    async function gen(){
      const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create-key',pass:document.getElementById('p').value,days:document.getElementById('d').value})});
      const data=await res.json();
      const b=document.getElementById('r');b.style.display='block';
      b.innerHTML=data.success?'<b style="color:#00e676">Key: '+data.key+'</b><br>Hết hạn: '+data.expireDate:'<b style="color:#ff5252">'+data.msg+'</b>';
      if(data.success)loadList();
    }
    async function loadList(){
      const p=document.getElementById('p').value;if(!p)return alert('Nhập mật khẩu Admin trước!');
      const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list-keys',pass:p})});
      const data=await res.json();if(!data.success)return alert(data.msg);
      document.getElementById('listBox').style.display='block';
      const c=document.getElementById('listContent');c.innerHTML=data.keys.length?'':'Chưa có Key nào.';
      data.keys.forEach(k=>{c.innerHTML+='<div class="key-item"><b>'+k.key+'</b> '+(k.isExpired?'<span style="color:#ff5252">(Hết hạn)</span>':'<span style="color:#00e676">(Còn hạn)</span>')+'<br>UID: '+k.boundUid+'<br>Hết hạn: '+k.expireDate+'<br><button class="btn-del" onclick="delKey(\''+k.key+'\')">Xóa / Khóa Key</button></div>'});
    }
    async function delKey(k){
      if(!confirm('Xóa vĩnh viễn Key '+k+'?'))return;
      const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete-key',pass:document.getElementById('p').value,key:k})});
      const data=await res.json();if(data.success)loadList();
    }
  </script>
</body>
</html>
